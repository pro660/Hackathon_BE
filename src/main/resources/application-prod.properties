server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.auth.log-verification-code=false
app.auth.cookie.secure=true
app.auth.jwt-secret=${JWT_SECRET}
app.auth.oauth.success-url=${FRONTEND_OAUTH_SUCCESS_URL}
app.auth.oauth.onboarding-url=${FRONTEND_OAUTH_ONBOARDING_URL}
app.auth.oauth.state-cookie.secure=true
app.auth.oauth.onboarding-cookie.secure=true
app.auth.oauth.naver.client-id=${NAVER_CLIENT_ID}
app.auth.oauth.naver.client-secret=${NAVER_CLIENT_SECRET}
app.auth.oauth.naver.redirect-uri=${NAVER_REDIRECT_URI}
app.auth.oauth.kakao.client-id=${KAKAO_CLIENT_ID}
app.auth.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
app.auth.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
