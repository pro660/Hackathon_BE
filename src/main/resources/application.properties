spring.application.name=hackathon-be
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.auth.issuer=${JWT_ISSUER:hackathon-be}
app.auth.jwt-secret=${JWT_SECRET:local-development-secret-key-change-before-production}
app.auth.access-token-ttl=30m
app.auth.refresh-token-ttl=14d
app.auth.email-code-ttl=5m
app.auth.signup-token-ttl=20m
app.auth.email-resend-interval=60s
app.auth.email-daily-send-limit=10
app.auth.email-max-attempts=5
app.auth.log-verification-code=${AUTH_LOG_VERIFICATION_CODE:true}
app.auth.cookie.name=refresh_token
app.auth.cookie.path=/api/auth
app.auth.cookie.same-site=Lax
app.auth.cookie.secure=${REFRESH_COOKIE_SECURE:false}

app.auth.oauth.success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:3000/oauth/success}
app.auth.oauth.onboarding-url=${FRONTEND_OAUTH_ONBOARDING_URL:http://localhost:3000/oauth/onboarding}
app.auth.oauth.state-ttl=5m
app.auth.oauth.onboarding-token-ttl=20m
app.auth.oauth.state-cookie.name=oauth_state
app.auth.oauth.state-cookie.path=/api/auth/oauth
app.auth.oauth.state-cookie.same-site=Lax
app.auth.oauth.state-cookie.secure=${OAUTH_COOKIE_SECURE:false}
app.auth.oauth.onboarding-cookie.name=social_onboarding_token
app.auth.oauth.onboarding-cookie.path=/api/auth/oauth/signup
app.auth.oauth.onboarding-cookie.same-site=Lax
app.auth.oauth.onboarding-cookie.secure=${OAUTH_COOKIE_SECURE:false}

app.auth.reauthentication.success-url=${FRONTEND_REAUTHENTICATION_SUCCESS_URL:http://localhost:3000/account/reauthentication/success}
app.auth.reauthentication.token-ttl=10m
app.auth.reauthentication.cookie.name=account_reauth_token
app.auth.reauthentication.cookie.path=/api/users/me
app.auth.reauthentication.cookie.same-site=Lax
app.auth.reauthentication.cookie.secure=${REAUTH_COOKIE_SECURE:false}

app.auth.oauth.naver.client-id=${NAVER_CLIENT_ID:}
app.auth.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.auth.oauth.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/api/auth/oauth/naver/callback}
app.auth.oauth.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
app.auth.oauth.naver.token-uri=https://nid.naver.com/oauth2.0/token
app.auth.oauth.naver.profile-uri=https://openapi.naver.com/v1/nid/me

app.auth.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
app.auth.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.auth.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth/kakao/callback}
app.auth.oauth.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
app.auth.oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
app.auth.oauth.kakao.profile-uri=https://kapi.kakao.com/v2/user/me

app.product-import.enabled=${APP_PRODUCT_IMPORT_ENABLED:false}

app.image-storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.image-storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.image-storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.image-assets.cleanup.enabled=${IMAGE_ASSET_CLEANUP_ENABLED:false}
app.image-assets.cleanup.temporary-ttl=24h
app.image-assets.cleanup.fixed-delay=1h
app.image-assets.cleanup.initial-delay=30s
app.image-assets.cleanup.batch-size=100
